# DNS interno do Docker. "valid=10s" faz o NGINX reconsultar o nome "backend"
# periodicamente e descobrir réplicas novas, removidas ou reiniciadas (IP novo).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend {
    # zone + "resolve" (NGINX >= 1.27.3): o NGINX mantém os IPs de TODAS as
    # réplicas do serviço "backend" e atualiza a lista dinamicamente.
    # Estratégia: least_conn, a requisição vai para a réplica com menos conexões ativas.
    zone backend_zone 64k;
    least_conn;
    server backend:5000 resolve max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    # Frontend React (SPA): rotas como /maker e /breaker caem no index.html
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API: /api/create -> backend:/create  |  /api/guess/<id> -> backend:/guess/<id>
    location /api/ {
        proxy_pass http://backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Se uma réplica falhar ou estiver fora do ar, tenta a próxima
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 3s;

        # Mostra qual réplica respondeu (útil para ver o balanceamento)
        add_header X-Upstream $upstream_addr always;
    }

    # Healthcheck do próprio NGINX
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
