name: guess-game

services:
  # ---------------- Banco de dados ----------------
  db:
    image: postgres:${POSTGRES_VERSION:-18-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpass}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      # Postgres 18+: a imagem oficial espera o volume em /var/lib/postgresql
      - pgdata:/var/lib/postgresql
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------- Backend Flask (N réplicas) ----------------
  backend:
    image: ${BACKEND_IMAGE:-guess-game-backend}:${BACKEND_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      FLASK_APP: run.py
      FLASK_DB_TYPE: postgres
      FLASK_DB_HOST: db
      FLASK_DB_PORT: "5432"
      FLASK_DB_USER: ${POSTGRES_USER:-postgres}
      FLASK_DB_PASSWORD: ${POSTGRES_PASSWORD:-secretpass}
      FLASK_DB_NAME: ${POSTGRES_DB:-postgres}
    depends_on:
      db:
        condition: service_healthy
    deploy:
      replicas: ${BACKEND_REPLICAS:-3}
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ---------------- NGINX: frontend React + proxy reverso ----------------
  nginx:
    image: ${FRONTEND_IMAGE:-guess-game-frontend}:${FRONTEND_VERSION:-1.0.0}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NGINX_VERSION: ${NGINX_VERSION:-1.28-alpine}
        REACT_APP_BACKEND_URL: /api
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8081}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - frontend-net
      - backend-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  pgdata:
    name: guess-game-pgdata

networks:
  # rede exposta (apenas o NGINX publica porta no host)
  frontend-net:
  # rede interna entre NGINX, backend e banco; o Postgres não é publicado no host
  backend-net:
